name: Android Release APK

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        else
          {
            echo "storeFile=wavelet-release.jks"
            echo "storePassword=wavelet123"
            echo "keyAlias=wavelet"
            echo "keyPassword=wavelet123"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, kept as an artifact.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Attach APKs to GitHub Release
      run: |
        tag="${GITHUB_REF_NAME}"
        if [[ ! "$tag" =~ ^v[0-9] ]]; then
          tag=$(gh release list -L 1 --json tagName -q '.[0].tagName')
        fi
        if [ -n "$tag" ]; then
          v="${tag#v}"
          mkdir -p release-apks
          find app/build/outputs/apk/prod/release/ -name "*arm64-v8a*.apk" -exec cp {} "release-apks/Wavelet-v${v}_arm64-v8a.apk" \;
          find app/build/outputs/apk/prod/release/ -name "*armeabi-v7a*.apk" -exec cp {} "release-apks/Wavelet-v${v}_armeabi-v7a.apk" \;
          find app/build/outputs/apk/prod/release/ -name "*universal*.apk" -exec cp {} "release-apks/Wavelet-v${v}.apk" \;
          ls -lh release-apks
          gh release upload "$tag" release-apks/*.apk --clobber
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
